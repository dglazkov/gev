<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gev — typed probabilistic decisions on GCP</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#fafaf9, #121211); --panel: light-dark(#fff, #1c1c1a); --line: light-dark(#e4e2dd, #33322e);
    --text: light-dark(#1c1b18, #ecebe6); --muted: light-dark(#6f6c64, #9d9a90);
    --accent: light-dark(#1a66d6, #6ea8ff); --track: light-dark(#eeece7, #2a2926);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 22px; margin: 0; } h1 + p { color: var(--muted); margin: 4px 0 24px; max-width: 70ch; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; } @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
  label, h2 { display: block; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  textarea, input { width: 100%; font: 13px/1.5 ui-monospace, monospace; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
  textarea { resize: vertical; } textarea + label, input + label { margin-top: 14px; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
  button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 6px; padding: 8px 18px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: progress; } #meta { color: var(--muted); font-size: 13px; }
  .answer { padding: 12px 0; border-top: 1px solid var(--line); } .answer:first-of-type { border-top: 0; padding-top: 0; }
  .head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 6px; }
  .id { font: 600 13px ui-monospace, monospace; } .verdict { font-weight: 600; } .conf { color: var(--muted); font-size: 12px; }
  .bar { display: grid; grid-template-columns: minmax(80px, 34%) 1fr 48px; gap: 8px; align-items: center; font-size: 13px; margin: 3px 0; }
  .bar span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .bar span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .track { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; } .fill { height: 100%; background: var(--accent); border-radius: 4px; opacity: .45; } .top .fill { opacity: 1; }
  .top span:first-child { font-weight: 600; }
  pre { margin: 0; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; } details { margin-top: 12px; } summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .err { color: light-dark(#b3261e, #ff8a80); }
</style>
</head>
<body>
<main>
  <h1>gev</h1>
  <p>Pass in state, ask typed questions, get probability distributions back — built from an LLM's first-token logprobs. A jev-compatible API (<code>POST /v1/systemone</code>) running on Cloud Run, with Gemma on a Cloud Run GPU.</p>
  <div class="grid">
    <section>
      <label for="state">State</label>
      <textarea id="state" rows="7"></textarea>
      <label for="questions">Questions</label>
      <textarea id="questions" rows="20" spellcheck="false"></textarea>
      <label for="key">API key (if the server requires one)</label>
      <input id="key" type="password" autocomplete="off">
      <div class="row"><button id="run">Decide</button><span id="meta"></span></div>
    </section>
    <section>
      <h2>Answers</h2>
      <div id="answers"><p class="conf">Run a request to see decisions.</p></div>
      <details><summary>Raw response</summary><pre id="raw"></pre></details>
    </section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
$("state").value = "Subject: Charged twice AGAIN\n\nThis is the third time this year you've double-billed me. I have a client demo in two hours and my account is locked because of the failed payment. Fix this NOW or I'm moving to a competitor.";
$("questions").value = JSON.stringify({
  team: { type: "choice", instructions: "Which team should handle this ticket?", criteria: {
    billing: "Payment or subscription issues", technical: "Bugs or integration problems", sales: "Pricing or account questions" } },
  urgent: { type: "noul", instructions: "The message conveys urgency or time-sensitivity" },
  churn_risk: { type: "noul", instructions: "The customer threatens to leave" },
  frustration: { type: "score", instructions: "How frustrated the customer appears", criteria: [
    "Calm, just stating facts", "Frustrated but civil", "Very angry, strong language" ] },
}, null, 2);

const el = (tag, className, text) => { const e = document.createElement(tag); if (className) e.className = className; if (text != null) e.textContent = text; return e; };
const pct = (p) => (p * 100).toFixed(1) + "%";

function bars(entries) {
  const max = Math.max(...entries.map(([, p]) => p));
  return entries.map(([name, p]) => {
    const row = el("div", "bar" + (p === max ? " top" : ""));
    const track = el("div", "track"), fill = el("div", "fill");
    fill.style.width = pct(p); track.append(fill);
    row.append(el("span", "", name), track, el("span", "", pct(p)));
    return row;
  });
}

function renderAnswer(id, a) {
  const box = el("div", "answer"), head = el("div", "head"), right = el("span");
  const verdict = a.type === "noul" ? (a.noul >= 0.5 ? "yes" : "no") : a.type === "choice" ? a.choice : a.score.toFixed(2) + " / " + (Object.keys(a.legend).length - 1);
  right.append(el("span", "verdict", verdict), a.confidence != null ? el("span", "conf", "  confidence " + a.confidence.toFixed(2)) : "");
  head.append(el("span", "id", id), right);
  const rows = a.type === "noul" ? [["yes", a.noul], ["no", 1 - a.noul]]
    : a.type === "choice" ? Object.entries(a.probabilities).sort((x, y) => y[1] - x[1]).slice(0, 12)
    : Object.entries(a.probabilities).map(([k, p]) => [k + " · " + a.legend[k], p]);
  box.append(head, ...bars(rows));
  return box;
}

$("run").onclick = async () => {
  const answers = $("answers"), started = performance.now();
  $("run").disabled = true; $("meta").textContent = "deciding…";
  try {
    const questions = JSON.parse($("questions").value);
    const headers = { "content-type": "application/json" };
    if ($("key").value) headers.authorization = "Bearer " + $("key").value;
    const response = await fetch("/v1/systemone", { method: "POST", headers, body: JSON.stringify({ state: $("state").value, model: "gev-latest", questions }) });
    const data = await response.json();
    $("raw").textContent = JSON.stringify(data, null, 2);
    if (!response.ok) throw new Error(data.error?.message + (data.error?.issues ? ": " + data.error.issues.map((i) => i.path + " " + i.message).join("; ") : ""));
    answers.replaceChildren(...Object.entries(data.answers).map(([id, a]) => renderAnswer(id, a)));
    $("meta").textContent = `${Math.round(performance.now() - started)} ms · ${data.model} · ${data.usage.input_tokens} input tokens`;
  } catch (e) {
    answers.replaceChildren(el("p", "err", e.message)); $("meta").textContent = "";
  } finally { $("run").disabled = false; }
};
</script>
</body>
</html>
